<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniDesk - Portal Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-4">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm border-0 rounded-3 mb-3">
                <div class="card-body p-4">
                    <div class="text-center mb-3">
                        <span class="fs-1">🎓</span>
                        <h4 class="fw-bold text-primary mb-1">UniDesk Helpdesk</h4>
                        <p class="text-muted small">Sign in with your username or university email</p>
                    </div>

                    <!-- Invalid Credentials Alert -->
                    <div th:if="${param.error}" class="alert alert-danger py-2 small mb-3 text-center" role="alert">
                        <i class="bi bi-exclamation-circle me-1"></i> Invalid username, email, or password.
                    </div>

                    <!-- Logout Success Alert -->
                    <div th:if="${param.logout}" class="alert alert-success py-2 small mb-3 text-center" role="alert">
                        <i class="bi bi-check-circle me-1"></i> You have logged out successfully.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold small text-secondary">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="admin or admin@university.edu" required autofocus />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required />
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-2 fw-semibold py-2">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </form>
                </div>
            </div>

            <!-- Pre-seeded Test Accounts Helper Box -->
            <div class="card border-0 shadow-sm bg-white rounded-3">
                <div class="card-body p-3 small">
                    <div class="fw-bold text-secondary text-uppercase mb-2">
                        <i class="bi bi-key-fill text-warning me-1"></i> Seeded Test Accounts
                    </div>
                    <ul class="list-unstyled mb-0 d-flex flex-column gap-2 text-muted">
                        <li class="p-2 rounded bg-light border">
                            <span class="badge bg-danger me-1">Admin</span>
                            <code>admin</code> / <code>admin123</code>
                        </li>
                        <li class="p-2 rounded bg-light border">
                            <span class="badge bg-success me-1">Officer</span>
                            <code>officer</code> / <code>officer123</code>
                        </li>
                        <li class="p-2 rounded bg-light border">
                            <span class="badge bg-primary me-1">Student</span>
                            <code>student</code> / <code>student123</code>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

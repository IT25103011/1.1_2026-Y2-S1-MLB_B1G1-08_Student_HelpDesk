<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Schedule Management - UniDesk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navigation Fragment -->
<div th:replace="~{fragments/navbar :: navbar('schedule', 'ADMIN')}"></div>

<div class="container my-4">
    <!-- Top Header -->
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2">
        <h4 class="mb-0 fw-bold text-dark text-uppercase">
            <i class="bi bi-calendar-check text-primary me-2"></i>ADMIN SCHEDULE MANAGEMENT
        </h4>
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i> Dashboard
        </a>
    </div>

    <!-- Section 1: Publish New Campus-Wide Event -->
    <div class="card shadow-sm border-0 rounded-3 mb-5">
        <div class="card-header bg-primary text-white py-3">
            <h5 class="card-title mb-0 fw-bold">
                <i class="bi bi-megaphone me-2"></i>PUBLISH NEW CAMPUS-WIDE EVENT
            </h5>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/schedule/create}" method="post">
                <input type="hidden" name="adminId" value="1" />
                <input type="hidden" name="location" value="Main Auditorium &amp; Virtual" />
                <input type="hidden" name="endTime" value="17:00:00" />

                <div class="row g-3">
                    <!-- Event Title -->
                    <div class="col-md-6">
                        <label for="eventTitle" class="form-label fw-semibold">Event Title:</label>
                        <input type="text" class="form-control" id="eventTitle" name="title" value="Annual IT Career Fair 2026" placeholder="e.g., Annual IT Career Fair 2026" required>
                    </div>

                    <!-- Target Audience -->
                    <div class="col-md-6">
                        <label for="targetAudience" class="form-label fw-semibold">Target:</label>
                        <select class="form-select" id="targetAudience" name="location">
                            <option value="All Students & Faculty" selected>All Students &amp; Faculty</option>
                            <option value="Undergraduates Only">Undergraduates Only</option>
                            <option value="Postgraduate Researchers">Postgraduate Researchers</option>
                            <option value="Faculty & Staff">Faculty &amp; Staff</option>
                        </select>
                    </div>

                    <!-- Event Date -->
                    <div class="col-md-6">
                        <label for="eventDate" class="form-label fw-semibold">Event Date:</label>
                        <input type="date" class="form-control" id="eventDate" name="date" value="2026-10-15" required>
                    </div>

                    <!-- Duration -->
                    <div class="col-md-6">
                        <label for="eventDuration" class="form-label fw-semibold">Duration:</label>
                        <select class="form-select" id="eventDuration" name="duration">
                            <option value="60">1 Hour</option>
                            <option value="120">2 Hours</option>
                            <option value="240">Half Day</option>
                            <option value="480" selected>Full Day</option>
                        </select>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary px-4 fw-semibold">[ Publish Event ]</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Section 2: Manage Existing Campus Events -->
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-header bg-white py-3 border-bottom">
            <h5 class="card-title mb-0 fw-bold text-dark">
                <i class="bi bi-list-task me-2 text-primary"></i>MANAGE EXISTING CAMPUS EVENTS
            </h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-bordered table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr class="text-secondary small fw-bold">
                            <th style="width: 15%;">Event ID</th>
                            <th style="width: 35%;">Event Title</th>
                            <th style="width: 20%;">Date</th>
                            <th style="width: 30%;">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Live dynamic loop -->
                        <tr th:if="${events != null and !#lists.isEmpty(events)}" th:each="ev : ${events}">
                            <td class="fw-bold text-primary" th:text="${'#EV-0' + ev.eventId}">#EV-042</td>
                            <td class="fw-semibold" th:text="${ev.title}">Mid-Semester Exam</td>
                            <td th:text="${ev.date}">2026-10-05</td>
                            <td>
                                <button type="button" class="btn btn-outline-primary btn-sm me-1" 
                                        th:onclick="'openEditModal(\'' + ${ev.eventId} + '\', \'' + ${ev.title} + '\', \'' + ${ev.date} + '\')'">
                                    [Edit Details]
                                </button>
                                <button type="button" class="btn btn-outline-secondary btn-sm me-1"
                                        th:onclick="'openReassignModal(\'' + ${ev.eventId} + '\', \'' + ${ev.date} + '\')'">
                                    [Reassign Date]
                                </button>
                                <form th:action="@{/admin/schedule/delete}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this event?');">
                                    <input type="hidden" name="eventId" th:value="${ev.eventId}" />
                                    <button type="submit" class="btn btn-outline-danger btn-sm">[Delete Event]</button>
                                </form>
                            </td>
                        </tr>

                        <!-- Wireframe Mock Fallback Rows -->
                        <tr th:if="${events == null or #lists.isEmpty(events)}">
                            <td class="fw-bold text-primary">#EV-042</td>
                            <td class="fw-semibold">Mid-Semester Exam</td>
                            <td>2026-10-05</td>
                            <td>
                                <button type="button" class="btn btn-outline-primary btn-sm me-1" onclick="openEditModal('042', 'Mid-Semester Exam', '2026-10-05')">[Edit Details]</button>
                                <button type="button" class="btn btn-outline-secondary btn-sm me-1" onclick="openReassignModal('042', '2026-10-05')">[Reassign Date]</button>
                            </td>
                        </tr>
                        <tr th:if="${events == null or #lists.isEmpty(events)}">
                            <td class="fw-bold text-primary">#EV-045</td>
                            <td class="fw-semibold">AI Workshop</td>
                            <td>2026-10-09</td>
                            <td>
                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="alert('Event #EV-045 has been deleted.')">[Delete Event]</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Edit Details Modal -->
<div class="modal fade" id="editEventModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold">Edit Event Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/schedule/update}" method="post">
                <div class="modal-body">
                    <input type="hidden" id="editEventId" name="eventId">
                    <input type="hidden" name="location" value="Main Auditorium">
                    <input type="hidden" name="duration" value="120">
                    <input type="hidden" name="endTime" value="12:00:00">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Event Title:</label>
                        <input type="text" class="form-control" id="editTitle" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Event Date:</label>
                        <input type="date" class="form-control" id="editDate" name="date" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Reassign Date Modal -->
<div class="modal fade" id="reassignDateModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-light">
                <h5 class="modal-title fw-bold">Reassign Event Date</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/admin/schedule/update}" method="post">
                <div class="modal-body">
                    <input type="hidden" id="reassignEventId" name="eventId">
                    <input type="hidden" name="title" value="Mid-Semester Exam">
                    <input type="hidden" name="location" value="Exam Hall A">
                    <input type="hidden" name="duration" value="180">
                    <input type="hidden" name="endTime" value="12:00:00">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Event Date:</label>
                        <input type="date" class="form-control" id="reassignDate" name="date" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm">Confirm Reassignment</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Footer Fragment -->
<div th:replace="~{fragments/navbar :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function openEditModal(id, title, date) {
        document.getElementById('editEventId').value = id;
        document.getElementById('editTitle').value = title;
        document.getElementById('editDate').value = date;
        new bootstrap.Modal(document.getElementById('editEventModal')).show();
    }

    function openReassignModal(id, date) {
        document.getElementById('reassignEventId').value = id;
        document.getElementById('reassignDate').value = date;
        new bootstrap.Modal(document.getElementById('reassignDateModal')).show();
    }
</script>
</body>
</html>
